# The job shuffle and the Arrow event log of fnct-bench's Bench, as a static
# library for its C++ port in fnctbench.hpp. rand and arrow are pinned to the
# versions fnct-bench resolves, so the shuffle and the log are the same code.
[package]
name = "benchlog"
version = "0.1.0"
edition = "2024"

[lib]
path = "lib.rs"
crate-type = ["staticlib", "rlib"]

[dependencies]
arrow = { version = "=54.3.1", default-features = false, features = ["ipc", "ipc_compression"] }
rand = "=0.9.5"

[workspace]
